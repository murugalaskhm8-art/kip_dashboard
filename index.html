<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Production KPI Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <h1>Food Production KPI Dashboard</h1>

    <!-- KPI CARDS -->
    <div class="cards">

        <div class="card">
            <h2>24,850 KG</h2>
            <p>Total Production</p>
        </div>

        <div class="card">
            <h2>₹18,75,420</h2>
            <p>Total Sales</p>
        </div>

        <div class="card">
            <h2>1254</h2>
            <p>Total Orders</p>
        </div>

        <div class="card">
            <h2>865</h2>
            <p>Total Customers</p>
        </div>

    </div>

    <!-- CHARTS -->
    <div class="chart-grid">

        <div class="chart-box">
            <h3>Monthly Production</h3>
            <canvas id="productionChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Sales Revenue</h3>
            <canvas id="salesChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Production Category</h3>
            <canvas id="categoryChart"></canvas>
        </div>

    </div>

    <!-- SMALL CARDS -->
    <div class="small-grid">

        <div class="small-card">
            <h3>Customer Satisfaction</h3>
            <h2>92%</h2>
            <canvas id="customerChart"></canvas>
        </div>

        <div class="small-card">
            <h3>Production Cost</h3>
            <h2>₹2,45,000</h2>
            <canvas id="costChart"></canvas>
        </div>

        <div class="small-card">
            <h3>Monthly Growth</h3>
            <h2>15%</h2>
            <canvas id="growthChart"></canvas>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
