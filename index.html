<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>Sales KPI Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h3>Total Sales</h3>
            <p>₹5,25,000</p>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <p>1,250</p>
        </div>

        <div class="card">
            <h3>Customers</h3>
            <p>850</p>
        </div>

        <div class="card">
            <h3>Profit</h3>
            <p>₹1,10,000</p>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="salesChart"></canvas>
    </div>

    <div class="chart-container">
        <div class="chart-box">
            <canvas id="profitChart"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <h2>Recent Sales</h2>

    <table>
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Sales</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>Electronics</td>
            <td>₹75,000</td>
        </tr>
        <tr>
            <td>Phone</td>
            <td>Electronics</td>
            <td>₹45,000</td>
        </tr>
        <tr>
            <td>Chair</td>
            <td>Furniture</td>
            <td>₹15,000</td>
        </tr>
    </table>
</div>

<script src="script.js"></script>

</body>
</html>
