<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Production KPI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="dashboard">

    <h1>Food Production KPI Dashboard</h1>

    <div class="top-section">

        <div class="left-cards">
            <div class="card">
                <h2>1250</h2>
                <p>Food Orders Today</p>
            </div>

            <div class="card">
                <h2>₹4,25,000</h2>
                <p>Monthly Revenue</p>
            </div>

            <div class="card">
                <h2>850 KG</h2>
                <p>Production Output</p>
            </div>
        </div>

        <div class="chart-card big-chart">
            <h3>Weekly Food Production</h3>
            <canvas id="productionChart"></canvas>
        </div>

        <div class="chart-card progress-card">
            <h3>Production Target</h3>
            <canvas id="targetChart"></canvas>
        </div>

    </div>

    <div class="bottom-section">

        <div class="chart-card">
            <h3>Monthly Growth</h3>
            <canvas id="growthChart"></canvas>
        </div>

        <div class="chart-card">
            <h3>Food Category Sales</h3>
            <canvas id="foodChart"></canvas>
        </div>

        <div class="right-side">

            <div class="small-card">
                <h2>₹220</h2>
                <p>Average Revenue / Product</p>
                <canvas id="revenueChart"></canvas>
            </div>

            <div class="small-card">
                <h2>78%</h2>
                <p>Customer Satisfaction</p>
                <canvas id="customerChart"></canvas>
            </div>

            <div class="small-card">
                <h2>₹120</h2>
                <p>Production Cost / Unit</p>
                <canvas id="costChart"></canvas>
            </div>

        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
